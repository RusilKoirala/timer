    <!-- Timer Section -->
    <h1 id="timer">00:00:00</h1>
    <div>
        <label for="timeInput">Set Time (in seconds):</label>
        <input type="number" id="timeInput" value="00" min="1">
    </div>

    <br>

    <!-- Timer buttons -->
    <div id="buttons">
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
    </div>
